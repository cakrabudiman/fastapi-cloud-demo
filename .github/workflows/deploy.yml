name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Deploy to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Konfigurasi identitas Git di server agar dikenali oleh Hugging Face
          git config --global user.email "cakrabudimanputra@gmail.com"
          git config --global user.name "cakrabudiman"

          # 2. Tambahkan alamat remote Hugging Face menggunakan format token yang valid
          git remote add hf https://cakrabudiman:$HF_TOKEN@huggingface.co/spaces/cakrabudiman/fastapi-cloud-demo

          # 3. Paksa push kode dari branch main GitHub ke branch main Hugging Face
          git push --force hf main
