name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Deploy to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Melakukan login menggunakan token hf kamu
          hf auth login --token $HF_TOKEN

          # Mengunggah proyek ke Spaces menggunakan perintah hf terbaru
          hf upload cakrabudiman/fastapi-cloud-demo . . --repo-type=space
